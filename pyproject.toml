[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-resource-disaggregation"
version = "0.1.0"
description = "Causal resource identification and PV power disaggregation from feeder measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "torch>=2.6,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
archives = ["py7zr>=0.22"]

[project.scripts]
grid-disaggregation = "grid_disaggregation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
